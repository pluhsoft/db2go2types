# Publishes the documentation site from docs/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the example to the site
        run: |
          mkdir -p docs/example
          {
            printf -- '---\ntitle: Example output\nnav_order: 9\n---\n\n# Example output\n\n'
            printf 'Generated from [`examples/blog/schema.sql`](https://github.com/%s/blob/main/examples/blog/schema.sql).\n\n' "$GITHUB_REPOSITORY"
            printf '## Diagram\n\n'; cat examples/blog/schema.md
            printf '\n## models.go\n\n```go\n'; cat examples/blog/repository/models.go; printf '```\n'
          } > docs/example/index.md
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
